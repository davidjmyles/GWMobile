<ion-header>
  <ion-toolbar color="dark" class="top-padding">
    <ion-buttons slot="end">
      <ion-button slot="icon-only" size="large" strong (click)="onLogout()">
        <ion-icon name="log-out-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-content color="background">
    <ion-grid>
      <ion-row>
        <ion-col sizeLg="8" offsetLg="2" sizeMd="8" offsetMd="2">
          <ion-card>
            <ion-card-content>
              <h2 class="ion-text-justify">
                Your details have not yet been verified. Please try again
                later.
              </h2>
              <hr />
              <h2 class="ion-text-justify">
                If it has been more than 5 days since registration, please
                contact us using the buttons below
              </h2>
            </ion-card-content>
          </ion-card>
          <hr />
          <hr />
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col sizeLg="8" offsetLg="2" sizeMd="8" offsetMd="2">
          <ion-button
            fill="solid"
            expand="block"
            (click)="linkTel()"
            color="buttons"
            shape="round"
            class="button-padding"
          >
            <ion-icon
              slot="start"
              name="call-outline"
              style="font-size: xx-large"
            ></ion-icon>
          </ion-button>
          <hr />
          <ion-button
            fill="solid"
            expand="block"
            (click)="linkEmail()"
            color="buttons"
            shape="round"
            class="button-padding"
          >
            <ion-icon
              slot="start"
              name="mail-outline"
              style="font-size: xx-large"
            ></ion-icon>
          </ion-button>
          <hr />
          <hr />
          <hr />
          <hr />
          <ion-button
            expand="block"
            color="primary"
            shape="round"
            class="button-padding"
            (click)="onLogout()"
            >return to login
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-content>
</ion-content>
