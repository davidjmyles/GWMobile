<ion-tabs>
  <ion-tab-bar slot="bottom" color="medium">
    <ion-tab-button tab="aboutus">
      <ion-icon name="information-circle-outline" style="font-size: xx-large"></ion-icon>
      <ion-label>About Us</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="payments">
      <!-- <ion-badge *ngIf="balanceIsLow" color="danger">!</ion-badge> -->
      <ion-icon name="card-outline" style="font-size: xx-large"></ion-icon>
      <ion-label>Donations</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="dashboard">
      <ion-icon name="grid-outline" style="font-size: xx-large"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="documents">
      <ion-icon
        name="document-text-outline"
        style="font-size: xx-large"
      ></ion-icon>
      <ion-label>Documents</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="account">
      <ion-icon name="id-card-outline" style="font-size: xx-large"></ion-icon>
      <ion-label>Account</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
