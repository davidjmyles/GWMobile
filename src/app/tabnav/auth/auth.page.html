<ion-content style="background-color: white">
  <div
    style="
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    "
  >
    <ion-card class="auth-card">
      <ion-grid>
        <hr />
        <hr />
        <hr />
        <hr />
        <ion-row>
          <ion-col sizeLg="6" offsetLg="3" size="8" offset="2">
            <ion-item lines="none">
              <div class="class">
                <ion-card>
                  <ion-img width="70" height="70" src="{{ logoImage }}">
                  </ion-img>
                </ion-card>
              </div>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
      <form #f="ngForm" (ngSubmit)="onLogin(f)">
        <ion-grid>
          <ion-row>
            <ion-col sizeLg="6" offsetLg="3" sizeMd="8" offsetMd="2">
              <ion-item
                fill="outline"
                class="large-font box-border"
                lines="none"
              >
                <ion-input
                  type="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="email"
                  required
                  email
                  #emailCtrl="ngModel"
                ></ion-input>
              </ion-item>

              <hr />
              <ion-item
                fill="outline"
                class="large-font box-border"
                lines="none"
                background="tertiary"
              >
                <ion-input
                  [type]="showPassword ? 'text' : 'password'"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="password"
                  required
                  minlength="8"
                  #passwordCtrl="ngModel"
                ></ion-input>
                <ion-icon
                  slot="end"
                  [name]="passwordIcon"
                  (click)="toggleViewPassword()"
                >
                </ion-icon>
              </ion-item>
              <ion-item lines="none">
                <p
                  slot="end"
                  (click)="forgotPassword()"
                  style="font-size: smaller"
                >
                  forgotten password?
                </p>
              </ion-item>
            </ion-col>
          </ion-row>

          <hr />
          <ion-row>
            <ion-col sizeLg="6" offsetLg="3" sizeMd="8" offsetMd="2">
              <!-- <div *ngIf="isLoading">
                <ion-spinner color="primary"></ion-spinner>
              </div> -->

              <hr />
              <hr />
              <hr />
              <div *ngIf="!hasBiometrics">
                <ion-button
                  class="large-font large-button"
                  style="font-weight: bolder"
                  type="submit"
                  expand="block"
                  [disabled]="!f.valid"
                  [color]="!f.valid? 'buttons':'buttons'"
                  >Login</ion-button
                >
              </div>
              <div *ngIf="hasBiometrics">
                <ion-button
                  class="large-font large-button"
                  style="font-weight: bolder"
                  (click)="onCheckBiometrics()"
                  expand="block"
                  [color]="!f.valid? 'buttons':'buttons'"
                  >Login with {{ biometryType }}</ion-button
                >
                <hr />
                <hr />
                <ion-button
                  class="large-font large-button"
                  style="font-weight: bolder"
                  type="submit"
                  expand="block"
                  [disabled]="!f.valid"
                  [color]="!f.valid? 'buttons':'buttons'"
                  >Login with Email & Password</ion-button
                >
              </div>
              <!-- 
              <hr />
              <hr />
              <ion-button
                fill="outline"
                class="large-font large-button"
                style="font-weight: bolder"
                (click)="onSetBiometrics()"
                expand="block"
                >Set Biometrics</ion-button
              > -->

              <hr />
              <hr />
              <ion-button
                *ngIf="!isLogin"
                class="large-font large-button"
                type="button"
                color="buttons"
                fill="solid"
                expand="block"
                (click)="onSignup()"
                >Not Yet Registered? Click Here</ion-button
              >
              <hr />
              <!-- <ion-button
                *ngIf="!isLogin"
                class="large-font large-button"
                type="button"
                color="tertiary"
                fill="outline"
                expand="block"
                (click)="forgotPassword()"
                >Reset Password</ion-button
              > -->
            </ion-col>
          </ion-row>
          <hr />
          <hr />
        </ion-grid>
      </form>
    </ion-card>
  </div>
</ion-content>
<ion-footer style="background-color: white" class="footer">
  <ion-item lines="none" class="ion-text-center">
    <ion-label>
      <h3 style="color: darkgray">
        GiftLink v{{ appVersion }} Carn Software Ltd
      </h3>
    </ion-label>
  </ion-item>
  <hr />
</ion-footer>
